; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[common]
build_flags = -fexceptions

[env]
platform = espressif32
board = adafruit_feather_esp32_v2
framework = espidf

monitor_speed = 115200
monitor_port = COM14
monitor_filters = esp32_exception_decoder

build_flags = ${common.build_flags}

[env:adafruit_feather_esp32_v2]

[env:adafruit_feather_esp32_v2_cfg_gp2y0e02b]
build_flags =
    ${common.build_flags}
    -D CFG_GP2Y0E02B_I2C_ADDR

[env:adafruit_feather_esp32_v2_gp2y0e02b_interface]
build_flags =
    ${common.build_flags}
    -D GP2Y0E02B_INTERFACE

[env:adafruit_feather_esp32_v2_dev]
build_type = debug
debug_tool = esp-prog
debug_init_break = tbreak app_main

[env:adafruit_feather_esp32_v2_cfg_gp2y0e02b_dev]
build_type = debug
debug_tool = esp-prog
debug_init_break = tbreak app_main

build_flags =
    ${common.build_flags}
    -D CFG_GP2Y0E02B_I2C_ADDR

[env:adafruit_feather_esp32_v2_gp2y0e02b_interface_dev]
build_type = debug
debug_tool = esp-prog
debug_init_break = tbreak app_main

build_flags =
    ${common.build_flags}
    -D GP2Y0E02B_INTERFACE